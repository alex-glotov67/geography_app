<style>
body{margin:0}
a{color:#1D5E8C}a:hover{color:#123F60}

.geo-c4{animation:geoContour 2.4s ease-in-out .9s infinite}
.geo-bar{animation:geoBar 1.4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.geo-c1,.geo-c2,.geo-c3,.geo-c4,.geo-bar{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E4ECEA; color: #1E2A2F; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; position: relative; overflow: hidden">
