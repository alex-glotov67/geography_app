name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Фронт — lint, типи, тести, збірка, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Збірка
        run: npm run build
        env:
          # Лише публічні значення; справжні задаються в Cloudflare Pages
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-placeholder
      - name: У dist/ немає секретів
        run: npm run check:dist
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  db:
    name: БД — локальний Supabase (staging)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Запуск Postgres
        run: supabase db start
      - name: Міграції з нуля + seed
        run: supabase db reset
      - name: Лінт схеми
        run: supabase db lint --level warning
      - name: Advisors (безпека й продуктивність)
        run: supabase db advisors --local --type all
      # З Фази 1: RLS-тести (pgTAP) — supabase test db
