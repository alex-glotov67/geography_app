name: CI

# Перевірки на кожен PR і push у main. Усе — на локальному Supabase (staging, SPEC 3.4).
# Фронт на prod публікує Cloudflare Workers Builds з main сам; базу на prod — лише вручну
# через «Деплой БД і функцій на prod» (deploy-prod.yml). Порядок релізу — docs/setup.md, розділ 6.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Лише на PR: якщо змінено міграції чи Edge Functions — нагадування про ручний деплой бази
  release-notice:
    name: Нагадування про деплой БД
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Чи змінено supabase/migrations або supabase/functions
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "$BASE...$HEAD" -- supabase/migrations supabase/functions)
          if [ -z "$changed" ]; then
            echo "Міграції й Edge Functions не змінено — після злиття досить автоматичного деплою фронту."
            exit 0
          fi
          echo "::warning title=Після злиття — деплой БД::Після злиття запусти «Деплой БД і функцій на prod» (Actions → Run workflow → main, confirm = prod). Змінено: $(echo "$changed" | tr '\n' ' ')"
          {
            echo "## Після злиття запусти «Деплой БД і функцій на prod»"
            echo
            echo "Фронт з main публікує Workers Builds одразу після злиття, а база на prod оновиться лише після ручного запуску."
            echo "Правило (SPEC 3.5): міграції — перед фронтом і зворотно сумісні. Якщо цей PR містить і фронт, що вже потребує нової схеми, — розбий: спершу міграції, деплой БД, потім фронт."
            echo "Actions → «Деплой БД і функцій на prod» → Run workflow → гілка main, confirm = prod. Порядок — docs/setup.md, розділ 6."
            echo
            echo "Змінено:"
            echo "$changed" | sed 's/^/- `/; s/$/`/'
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: Фронт — lint, типи, тести, збірка
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Vitest + 100 % покриття @shared/scoring
        run: npm run test:coverage
      - name: Демо-пакети проходять валідацію
        run: npm run validate
      - name: Збірка
        run: npm run build
        env:
          # Лише публічні значення-заглушки; справжні — змінні збірки в Cloudflare Workers Builds
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-placeholder
      - name: У dist/ немає секретів
        run: npm run check:dist

  db:
    name: БД, демо-зміст і e2e (локальний Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0 # як у package.json (devDependencies.supabase); оновлювати разом
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Запуск Supabase (без Studio, пошти, функцій і логів)
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
      - name: Міграції без seed — демо-рядків немає, show_demo вимкнено
        run: |
          supabase db reset --no-seed
          supabase db query --local -f supabase/checks/no-demo-in-migrations.sql
      - name: Міграції з нуля + seed
        run: supabase db reset
      - name: Лінт схеми
        run: supabase db lint --level warning
      - name: Advisors (безпека й продуктивність)
        run: supabase db advisors --local --type all
      - name: RLS і версії змісту (pgTAP)
        run: supabase test db
      - name: Типи БД актуальні
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.types.ts
          diff -u src/types/database.types.ts /tmp/database.types.ts
      - name: Демо-зміст (довідник CSV + пакет .geo.zip → публікація)
        run: npm run seed
      - name: Збірка з локальним Supabase
        run: |
          supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY)=' | sed -e 's/^API_URL=/VITE_SUPABASE_URL=/' -e 's/^PUBLISHABLE_KEY=/VITE_SUPABASE_PUBLISHABLE_KEY=/' > .env.local
          npm run build
      - run: npx playwright install --with-deps chromium
      - name: e2e (wrangler dev — SPA-режим як на Workers)
        run: npm run e2e
        env:
          WRANGLER_SEND_METRICS: 'false'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
