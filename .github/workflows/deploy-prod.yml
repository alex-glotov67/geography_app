name: Деплой БД і функцій на prod

# Лише вручну, після зеленого CI на main (SPEC 3.5; CLAUDE.md: prod — лише з дозволу вчителя).
# Фронт на prod публікує Cloudflare Pages з гілки main (docs/setup.md).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Напиши «prod», щоб підтвердити'
        required: true

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.inputs.confirm == 'prod' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0 # як у package.json (devDependencies.supabase); оновлювати разом
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Які міграції застосуються
        run: supabase db push --dry-run
      - name: Міграції
        run: supabase db push
      - name: Edge Functions
        run: |
          if ls supabase/functions/*/index.ts >/dev/null 2>&1; then
            supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
          else
            echo "Функцій ще немає — пропускаю"
          fi
